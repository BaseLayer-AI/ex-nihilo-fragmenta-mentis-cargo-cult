name: ci
on: push
jobs:
  aarch64-darwin:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - name: uname-a
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.1/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix --version
      run: nix --version
    - name: nix run
      run: nix run
    - name: nix run "https://flakehub.com/f/BaseLayer-AI/ex-nihilo-fragmenta-mentis-cargo-cult/*"#cargo-cult
      run: bash -c 'nix run "https://flakehub.com/f/BaseLayer-AI/ex-nihilo-fragmenta-mentis-cargo-cult/*"#cargo-cult'

  aarch64-linux:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@v7
    - name: uname -a
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.1/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix --version
      run: nix --version
    - name: nix run
      run: nix run
    - name: nix run "https://flakehub.com/f/BaseLayer-AI/ex-nihilo-fragmenta-mentis-cargo-cult/*"#cargo-cult
      run: bash -c 'nix run "https://flakehub.com/f/BaseLayer-AI/ex-nihilo-fragmenta-mentis-cargo-cult/*"#cargo-cult'

  x86_64-linux:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: uname -a
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.1/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix --version
      run: nix --version
    - name: nix run
      run: nix run
    - name: nix run "https://flakehub.com/f/BaseLayer-AI/ex-nihilo-fragmenta-mentis-cargo-cult/*"#cargo-cult
      run: bash -c 'nix run "https://flakehub.com/f/BaseLayer-AI/ex-nihilo-fragmenta-mentis-cargo-cult/*"#cargo-cult'

